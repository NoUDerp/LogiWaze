            box-shadow: 0 0 4px 4px rgba(0, 0, 0, .6) !important;
            opacity: 1 !important
        }

        .leaflet-routing-alt, .leaflet-routing-error, .leaflet-routing-geocoders {
            padding: 6px;
            margin-top: 2px;
            transition: all .2s ease
        }

        .leaflet-routing-container {
            height: calc(100% - 20px);
            display: flex;
            flex-flow: column;
            padding-bottom: 2px
        }

        .leaflet-routing-alternatives-container::-webkit-scrollbar {
            display: none
        }

        .leaflet-routing-alternatives-container {
            overflow-y: auto;
            -ms-overflow-style: none;
            scrollbar-width: none
        }

        .route-summary tr td {
            color: #fff;
            text-shadow: 0 0 4px #000, 0 0 4px #000, 0 0 4px #000
        }

        .detailed-routeinfo {
            color: #ddd;
            text-shadow: 0 0 2px #000, 0 0 2px #000, 0 0 2px #000
        }

        .leaflet-bar .leaflet-routing-alt:last-child {
            border-bottom: none
        }

        .leaflet-routing-alt-minimized {
            color: #888;
            max-height: 64px;
            overflow: hidden;
            cursor: pointer
        }

        .leaflet-routing-alt table {
            border-collapse: collapse
        }

        .leaflet-routing-alt::-webkit-scrollbar {
            width: 8px
        }

        .leaflet-routing-alt::-webkit-scrollbar-track {
            border-radius: 2px;
            background-color: #eee
        }

        .leaflet-routing-alt::-webkit-scrollbar-thumb {
            border-radius: 2px;
            background-color: #888
        }

        .leaflet-routing-geocoders button {
            width: 50px;
            height: 50px;
            font: 700 18px Renner;
            color: #ddd;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #555;
            margin: 2px;
            float: left;
            cursor: pointer;
            transition: background-color .2s ease
        }

        .leaflet-routing-icon-continue {
            background-position: 0 0
        }

        .leaflet-routing-icon-sharp-right {
            background-position: -20px 0
        }

        .leaflet-routing-icon-turn-right {
            background-position: -40px 0
        }

        .leaflet-routing-icon-bear-right {
            background-position: -60px 0
        }

        .leaflet-routing-icon-u-turn {
            background-position: -80px 0
        }

        .leaflet-routing-icon-sharp-left {
            background-position: -100px 0
        }

        .leaflet-routing-icon-turn-left {
            background-position: -120px 0
        }

        .leaflet-routing-icon-bear-left {
            background-position: -140px 0
        }

        .leaflet-routing-icon-depart {
            background-position: -160px 0
        }

        .leaflet-routing-icon-enter-roundabout {
            background-position: -180px 0
        }

        .leaflet-routing-icon-arrive {
            background-position: -200px 0
        }

        .leaflet-routing-icon-via {
            background-position: -220px 0
        }

        .leaflet-routing-geocoders div {
            padding: 4px 0
        }

        .leaflet-routing-geocoders input {
            width: 303px;
            width: calc(100% - 4px);
            line-height: 1.67;
            border: 1px solid #ccc
        }

        button.leaflet-routing-add-waypoint {
            padding: 0
        }

        .leaflet-routing-add-waypoint:after {
            content: "+";
            font-weight: 400;
            font-size: 30px;
            line-height: 40px
        }

        .leaflet-routing-reverse-waypoints:after {
            font-weight: 400;
            content: "⇅";
            font-size: 30px;
            line-height: 50px
        }

        .leaflet-routing-geocoders button:hover {
            background-color: #eee
        }

        .leaflet-routing-geocoder, .leaflet-routing-geocoders input, .leaflet-routing-remove-waypoint {
            position: relative
        }

        .leaflet-routing-geocoder-result {
            font: 12px/1.5 Renner;
            position: absolute;
            max-height: 0;
            overflow: hidden;
            transition: all .5s ease;
            z-index: 1000
        }

        .leaflet-routing-geocoder-result table {
            width: 100%;
            border-radius: 0 0 4px 4px;
            background-color: #fff;
            cursor: pointer
        }

        .leaflet-routing-geocoder-result-open {
            max-height: 800px
        }

        .leaflet-routing-geocoder-no-results {
            font-style: italic;
            color: #888
        }

        .leaflet-routing-remove-waypoint {
            background-color: transparent;
            display: inline-block;
            vertical-align: middle;
            cursor: pointer
        }

        .leaflet-routing-remove-waypoint:after {
            position: absolute;
            display: block;
            width: 15px;
            height: 1px;
            z-index: 1;
            right: 1px;
            top: 3px;
            bottom: 0;
            font-size: 18px;
            font-weight: 700;
            content: "×";
            text-align: center;
            cursor: pointer;
            color: #ccc;
            background: #fff;
            margin: -16px auto auto;
            padding: 2px 4px 16px 2px;
            line-height: 1
        }

        .leaflet-routing-remove-waypoint:hover {
            color: #000
        }

        .leaflet-routing-instruction-distance {
            width: 48px
        }

            pointer-events: auto;

            border: 1px solid #555555fb;

            border-right: none !important;
            color: #ccc;
            border-radius: 4px unset unset 4px !important

        }

        .layer-icon {
            max-width: 16px;
            max-height: 16px;
            margin-right: 4px
        }

        .leaflet-marker-draggable {
            z-index: -10000
        }

        .route-summary button {
            background: #444857;
            color: #fff;
            font-weight: 700;
            border-radius: 3px;
            border: 2px solid transparent;
            font-size: 18px;
            margin: 0 4px
        }

        .play-button {
            display: inline-block;
            transition: all .5s ease
        }

        .play-button .triangle {
            transition: all .7s ease-in-out;
            stroke-dasharray: 240;
            stroke-dashoffset: 480;
            stroke: #fff;
            transform: translateY(0)
        }

        .play-button svg {
            width: 22px;
            height: 22px
        }

        .play-button:hover .triangle {
            stroke-dashoffset: 0;
            opacity: 1;
            stroke: #fff;
            animation: none nudge .7s ease-in-out
        }

        .route-summary-header {
            pointer-events: auto;
            padding: 4px 0;
            line-height: 38px
        }

        .route-summary button:hover {
            opacity: 1;
            transition: ease-in .2s;
            background-color: #555968
        }

        .audio-controls {
            transform: translateY(5px);
            height: 28px;
            margin-left: auto;
            display: inline;
            float: right;
            display: table-cell;
            vertical-align: middle
        }

        .vehicle-speed-panel {
            width: 100%
        }

        .no-click, .vehicle-speed-panel {
            pointer-events: none !important
        }

        .route-summary {
            margin-bottom: 6px !important;
            border: 0;
            width: 100%
        }

        .vehicle-speed-panel .fast-truck {
            height: 28px;
            margin: 0 4px;
            vertical-align: middle;
            filter: brightness(100%) saturate(100)
        }

        .vehicle-speed-panel .slow-truck {
            filter: brightness(90%) sepia(25%) saturate(90)
        }

        .route-summary img, .vehicle-speed-panel .slow-truck, .vehicle-speed-panel .slowest-truck {
            height: 28px;
            margin: 0 4px;
            vertical-align: middle
        }

        .route-summary img {
            margin: 0 .5em;
            width: 32px;
            height: 32px
        }

        .leaflet-control-container .leaflet-routing-container-hide {
            position: relative !important
        }

        .leaflet-control-attribution, .leaflet-routing-alt-minimized .detailed-routeinfo {
            display: none
        }

        #map-frame {
            opacity: 0;
            transition: opacity 3s
        }

        #loader-holder {
            align-items: center;
            justify-content: center;
            opacity: 1;
            transition: opacity .5s;
            position: absolute;
            width: 100%;
            height: 100%;
            top: calc(50% - 60px);
            left: 0;
            right: 0;
            bottom: 0;
            background-color: transparent;
            z-index: 2;
            cursor: pointer;
            color: #fff
        }

        .leaflet-routing-alt table {
            font-size: small;
            border-spacing: 0;
            padding: 0;
            margin: 0
        }

        @font-face {
            font-family: "Renner";
            src: url(../Renner.ttf);
            font-weight: 400;
            font-style: normal
        }

        .leaflet-container, html {
            font-family: Renner
        }

        .leaflet-zoom-anim .leaflet-zoom-animated {
            transition: ease-in-out;
            transition-duration: .1s
        }

        .leaflet-routing-container {
            border: 1px solid #555555fb !important;
            border-right: none !important;
            border-collapse: collapse !important;
            border-radius: 4px 0 0 4px !important;
            opacity: .85
        }

        .leaflet-control-layers {
            opacity: .85
        }

        .logo {
            position: absolute;
            left: 50%;
            align-content: center;
            vertical-align: middle;
            transform: translateX(-50%) translateY(25%)
        }

        .loader {
            border: 16px solid #f3f3f3;
            border-top: 16px solid #3498db;
            border-radius: 50%;
            width: 120px;
            height: 120px;
            animation: spin 2s linear infinite;
            margin: auto
        }

            function SmartAutoZoom() {
                minX = null;
                minY = null;
                maxX = null;
                maxY = null;
                var count = 0;
                for (var i = 0; i < waypoints.length; i++) {
                    var u = waypoints[i].latLng;
                    if (u != null) {
                        count++;
                        if (minX == null || u.lng < minX)
                            minX = u.lng;
                        if (minY == null || u.lat < minY)
                            minY = u.lat;
                        if (maxX == null || u.lng > maxX)
                            maxX = u.lng;
                        if (maxY == null || u.lat > maxY)
                            maxY = u.lat;
                    }
                }

                if (CurrentRoute != null)
                    for (var i = 0; i < CurrentRoute.coordinates.length; i++) {
                        var u = CurrentRoute.coordinates[i];
                        if (u != null) {
                            count++;
                            if (minX == null || u.lng < minX)
                                minX = u.lng;
                            if (minY == null || u.lat < minY)
                                minY = u.lat;
                            if (maxX == null || u.lng > maxX)
                                maxX = u.lng;
                            if (maxY == null || u.lat > maxY)
                                maxY = u.lat;
                        }
                    }

                if (count > 1) {
                    var rangeX = maxX - minX;
                    var rangeY = maxY - minY;
                    var buffer = .05;
                    PauseAutoZoom();
                    mymap.fitBounds([[minY - rangeY * buffer, minX - rangeX * buffer], [minY + (1.0 + buffer * 2.0) * rangeY, minX + (1.0 + buffer * 2.0) * rangeX]], {paddingBottomRight: [getPanelVisibleWidth(), getPanelVisibleHeight()]});
                    ResumeAutoZoom();
                    AutoZoom = true;

                var counter = 0;
                keys = Object.keys(active_layers);

                    if (active_layers[keys[i]] === true)
                        switch (keys[i].replace(/<.*> */, '')) {

                                break;
                            case "Labels":
                                counter |= 1 << 16;
                                break;
                            case "Basic Font":
                                counter |= 1 << 17;
                                break;
                        }

                l = l.concat(':').concat(counter.toString(16).toUpperCase());

                var bounds = mymap.getBounds();

                var W = bounds.getWest(), E = bounds.getEast(), N = bounds.getNorth(), S = bounds.getSouth();

                        break;
                    case "Road Control":
                        Router.showRoads();
                        break;
                    case "Borders":
                        Router.showBorders();
                        break;
                    case "Labels":
                        Router.showLabels();
                        break;
                    case "Basic Font":
                        Router.showBoringFont();
                        break;
                }
                active_layers[event.name.replace(/<.*> */, '')] = true;
                update_state();
            });

            mymap.on('overlayremove', function (event) {
                if (no_update) return;
                switch (event.name.replace(/<.*> */, '')) {
                    case "Control":
                        Router.hideControl();
                        break;
                    case "Town Halls":
                        Router.hideTownHalls();
                        break;
                    case "Refineries":
                        Router.hideRefineries();
                        break;
                    case "Factories":
                        Router.hideFactories();
                        break;
                    case "Fuel":
                        Router.hideFuel();
                        break;
                    case "Components":
                        Router.hideComponents();
                        break;
                    case "Storage":
                        Router.hideStorage();
                        break;
                    case "Sulfur":
                        Router.hideSulfur();
                        break;
                    case "Coal":
                        Router.hideCoal();
                        break;
                    case "Salvage":
                        Router.hideSalvage();
                        break;
                    case "Road Control":
                        Router.hideRoads();
                        break;
                    case "Borders":
                        Router.hideBorders();
                        break;
                    case "Labels":
                        Router.hideLabels();
                        break;
                    case "Basic Font":
                        Router.hideBoringFont();
                        break;
                }
                active_layers[event.name.replace(/<.*> */, '')] = false;
                update_state();
            });


            // filter layers
            if (j.length > 1)
                layers = parseInt(j[1], 16);

            if (j.length > 2) {
                // set camera
                var coords = j[2].split(/,/);
                var z = parseFloat(coords[2]);
                PauseAutoZoom();

                var zoom = mymap.getZoom();
                var s = mymap.unproject([getPanelVisibleWidth(), getPanelVisibleHeight()], zoom);
                var xoffset = isNaN(s.lng) ? 0 : s.lng;
                var yoffset = isNaN(s.lat) ? 0 : s.lat;

                mymap.setView([parseFloat(coords[1]) + .5 * yoffset, parseFloat(coords[0]) + .5 * xoffset], z);
                ResumeAutoZoom();
            }


            Router.Control.on('routeselected', function (event) {
                Router.setRoute(event.route);
                CurrentRoute = event.route;
                AutoZoom = true;
                SmartAutoZoom();
            });

            if (j.length > 0) {
                h = j[0];

                var l = h.split("|");
                points = [];
                for (var i = 0; i < l.length; i++) {
                    // if this is a town name locate it

                    var a = l[i].split(",");
                    if (a.length < 2) {
                        if (a[0] != '') {
                            var u = Geocoder.lookup(a[0]);
                            points.push([u.y, u.x]);
                        } else {
                            points.push([]);
                        }
                    } else
                        points.push([parseFloat(a[0]), parseFloat(a[1])]);
                }
            }
            active_layers["Town Halls"] = (layers & (1 << 1)) != 0;
            active_layers["Borders"] = (layers & (1 << 2)) != 0;
            active_layers["Road Control"] = (layers & (1 << 4)) != 0;
            active_layers["Refineries"] = (layers & (1 << 7)) != 0;
            active_layers["Factories"] = (layers & (1 << 8)) != 0;
            active_layers["Storage"] = (layers & (1 << 9)) != 0;
            active_layers["Salvage"] = (layers & (1 << 10)) != 0;
            active_layers["Components"] = (layers & (1 << 11)) != 0;
            active_layers["Fuel"] = (layers & (1 << 12)) != 0;
            active_layers["Sulfur"] = (layers & (1 << 13)) != 0;
            active_layers["Coal"] = (layers & (1 << 14)) != 0;
            active_layers["Control"] = (layers & (1 << 15)) != 0;
            active_layers["Labels"] = (layers & (1 << 16)) != 0;
            active_layers["Basic Font"] = (layers & (1 << 17)) != 0;

            keys = Object.keys(active_layers);
            for (var i = 0; i < keys.length; i++)
                if (false == active_layers[keys[i]])
                    switch (keys[i].replace(/<.*> */, '')) {
                        case "Control":
                            Router.hideControl();
                            Router.MapControl.remove();
                            break;
                        case "Town Halls":
                            Router.hideTownHalls();
                            Router.TownHalls.remove();
                            break;
                        case "Borders":
                            Router.Borders.remove();
                            Router.hideBorders();
                            break;
                        case "Road Control":
                            Router.Roads.remove();
                            Router.hideRoads();
                            break;
                        case "Refineries":
                            Router.hideRefineries();
                            Router.Refineries.remove();
                            break;
                        case "Factories":
                            Router.hideFactories();
                            Router.Factories.remove();
                            break;
                        case "Storage":
                            Router.Storage.remove();
                            Router.hideStorage();
                            break;
                        case "Salvage":
                            Router.Salvage.remove();
                            Router.hideSalvage();
                            break;
                        case "Components":
                            Router.Components.remove();
                            Router.hideComponents();
                            break;
                        case "Fuel":
                            Router.Fuel.remove();
                            Router.hideFuel();
                            break;
                        case "Sulfur":
                            Router.Sulfur.remove();
                            Router.hideSulfur();
                            break;
                        case "Coal":
                            Router.Coal.remove();
                            Router.hideCoal();
                            break;
                        case "Road Control":
                            Router.Roads.remove();
                            Router.hideRoads();
                            break;
                        case "Labels":
                            Router.Labels.remove();
                            Router.hideLabels();
                            break;
                        case "Basic Font":
                            Router.BoringFont.remove();
                            Router.hideBoringFont();
                            break;
                    }

            Router.Control.setWaypoints(points);
            waypoints = [];
            for (var i = 0; i < points.length; i++)
                waypoints.push({latLng: {lat: points[i][0], lng: points[i][1]}});
            update_state();

            Router.Control.on('waypointschanged', function (event) {
                waypoints = event.waypoints;
                update_state();
                mymap.closePopup();
                AutoZoom = true;
                SmartAutoZoom();
            });

            document.getElementById("map-frame").style.opacity = '1';
            document.getElementById("loader-holder").style.opacity = '0';
            setTimeout(function () {
                document.getElementById("loader-holder").style.display = 'none';
            }, 1000);

        }, shard_url, function (error) {
            console.log(error);
            alert("War API cannot be contacted right now, it may be offline or there may be a network problem");
        });
    }

</script>
</body>
</html>
